<!-- ############### PORTAL BLOCK 3 of 3 — YOUR PACKETS (gated) + INLINE SIGN-IN ############### -->
<!-- Logged OUT -> .pk-login (foxy-logic-authenticated="false") shows the sign-in card in the
     exact spot the packets appear. Logged IN -> foxy-logic hides it and reveals the per-packet
     tiles; after an inline sign-in we refresh in place so foxy-logic re-evaluates the session. -->
<style>
  .pk3{--pk-bg:#DFE6F4;--pk-card:45.6%;--pk-gap:3.25%;
       background:var(--pk-bg);color:#24364b;padding:1.7% 2.6% 4.1%}
  .pk3 *{box-sizing:border-box}
  .pk3 .pk-head{display:block;width:40%;min-width:260px;max-width:752px;height:auto;margin:0 auto 4.2%}
  .pk3 .pk-grid{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:var(--pk-gap);margin:0 auto}
  .pk3 .pk-cell{flex:0 1 var(--pk-card);max-width:1095px;min-width:0}
  .pk3.pk-one .pk-cell{flex-basis:62%}
  .pk3 .tile{position:relative;width:100%;line-height:0;filter:drop-shadow(0 12px 24px rgba(24,36,64,.20))}
  .pk3 .tile img{width:100%;display:block}
  .pk3 .tile a{position:absolute;display:block;border-radius:99px}
  .pk3 .tile a:focus-visible{outline:3px solid #0A274C;outline-offset:3px}

  /* inline sign-in card — logged out only. Emily's baked art (lock + heading) + themed Foxy form. */
  .pk3 .pk-login{max-width:600px;margin:0 auto;background:#fff;border-radius:22px;
       box-shadow:0 16px 34px rgba(24,36,64,.16);padding:30px 32px 34px;
       display:flex;flex-direction:column;align-items:center;line-height:normal}
  .pk3 .pk-signhead{display:block;margin:0 auto 22px;width:min(90%,510px);height:auto}  /* centered to the card + larger */
  .pk3 .pk-login-row{display:flex;gap:24px;align-items:center;justify-content:center;width:100%}
  .pk3 .pk-lock{width:92px;flex:0 0 auto;height:auto;display:block}
  .pk3 .pk-login-body{flex:0 1 400px;min-width:0}
  .pk3 .pk-login foxy-customer-portal{display:block;width:100%;
       /* text-color is NAVY (not white) so the tertiary "Get temporary password" link is visible on
          the white card; the Sign in button keeps its own white label (uses --lumo-primary-contrast-color). */
       --lumo-primary-color:#24364b;--lumo-primary-text-color:#24364b;
       --lumo-border-radius-m:11px;--lumo-border-radius-l:11px;--lumo-base-color:#ffffff;
       --lumo-font-family:'Avenir Next','Poppins','Segoe UI',Arial,sans-serif}
  @media (max-width:900px){
    .pk3{padding:4% 5% 7%}
    .pk3 .pk-head{width:66%;margin-bottom:6%}
    .pk3 .pk-cell,.pk3.pk-one .pk-cell{flex-basis:100%}
    .pk3 .pk-grid{gap:6%}
    .pk3 .pk-login{text-align:center;padding:26px 22px 30px}
    .pk3 .pk-login-row{flex-direction:column;gap:14px}
    .pk3 .pk-lock{width:84px}
    .pk3 .pk-login-body{flex-basis:auto;width:100%}
    .pk3 .pk-signhead{width:min(96%,420px);margin:0 auto 16px}
  }
</style>
<div class="pk3" id="pk3">
  <img class="pk-head" src="https://sundayschoolsimplified.netlify.app/assets/sss-portal-header-v3.png"
       alt="Your Packets — each includes six lessons, online &amp; printable.">

    </div>
  </div>

  <!-- LOGGED IN: the per-packet tiles (each revealed only if that packet was purchased) -->
  <div class="pk-grid">

    <div class="pk-cell" foxy-logic-transaction-includes="SSS-BEYONDBUMPER">

           style="left:55.5%;top:70%;width:28%;height:10%" aria-label="Open the Beyond Bumper Stickers packet"></a>
        <a href="#" onclick="return sssPDF('https://sundayschoolsimplified.netlify.app/packets/beyond-bumper-stickers/Beyond%20Bumper%20Stickers.pdf','Beyond Bumper Stickers')"
           style="left:55.5%;top:80.3%;width:28%;height:10%" aria-label="Beyond Bumper Stickers printable PDF"></a>
      </div>
    </div>

    <div class="pk-cell" foxy-logic-transaction-includes="SSS-GOSPELWOMEN">
      <div class="tile">
        <img src="https://sundayschoolsimplified.netlify.app/assets/sss-portal-tile-women-v4.png"
             alt="The Gospel According to the Women — Volume 2. Six courageous women guide our faith journeys today. Six lessons, online &amp; printable.">
        <!-- cover thumbnail is also clickable -> opens the packet -->
        <a href="/sss/gospel-according-to-the-women"
           style="left:5.5%;top:8.5%;width:46%;height:80%;border-radius:14px" aria-label="Open The Gospel According to the Women packet"></a>
        <a href="/sss/gospel-according-to-the-women"
           style="left:55.5%;top:70%;width:28%;height:10%" aria-label="Open The Gospel According to the Women packet"></a>
        <a href="#" onclick="return sssPDF('https://sundayschoolsimplified.netlify.app/packets/gospel-according-to-the-women/The%20Gospel%20According%20to%20the%20Women.pdf','The Gospel According to the Women')"
           style="left:55.5%;top:80.3%;width:28%;height:10%" aria-label="The Gospel According to the Women printable PDF"></a>
      </div>
    </div>

  </div>
</div>
<!-- Foxy customer-portal element (same one the Account page uses) -->
<script type="module">
  import 'https://cdn-js.foxy.io/elements@1/foxy-customer-portal.js';
  const I18nElement = customElements.get('foxy-i18n');
  const i18nBase = 'https://cdn-js.foxy.io/elements@1/translations';
  I18nElement.onResourceFetch((ns, lang) => fetch(`${i18nBase}/${ns}/${lang}.json`));
</script>
<script>
  // Open the printable PDF through the in-page pdf.js viewer so its scripture/video/resource links
  // open in a NEW browser tab instead of replacing the PDF. Opens in a NORMAL browser tab (address
  // bar + back button), not a chromeless pop-out; the named target reuses the tab (Emily, 2026-09-01).
  function sssPDF(url,title){
    var v='https://sundayschoolsimplified.netlify.app/pdfview.html?file='+encodeURIComponent(url)
        +(title?'&title='+encodeURIComponent(title):'');
    window.open(v,'sssPdf'); return false;
  }
  (function(){
    function sync(){                         // foxy-logic reveals tiles asynchronously
      var secs=document.querySelectorAll('.pk3');
      for(var s=0;s<secs.length;s++){
        var cells=secs[s].querySelectorAll('.pk-cell'), shown=0;
        for(var i=0;i<cells.length;i++){ if(cells[i].offsetParent!==null) shown++; }
        secs[s].classList.toggle('pk-one', shown===1);
      }
    }
    new MutationObserver(sync).observe(document.body,{attributes:true,subtree:true,attributeFilter:['style','class','hidden']});
    addEventListener('resize',sync); addEventListener('load',sync);
    var n=0, t=setInterval(function(){ sync(); if(++n>20) clearInterval(t); },250);
    sync();
  })();
  // After an inline sign-in, refresh in place so foxy-logic re-evaluates and the tiles appear
  // (same URL, so the user stays on My Lessons). If Foxy's event name differs, sign-in still
  // works — the tiles just need one manual refresh; adjust the event here after live testing.
  (function(){
    var portal=document.querySelector('.pk-login foxy-customer-portal');
    if(!portal) return;
    portal.addEventListener('signin', function(){ location.reload(); });
  })();
</script>
