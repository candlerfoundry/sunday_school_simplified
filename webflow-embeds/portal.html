<!-- =====================================================================
     SUNDAY SCHOOL SIMPLIFIED — LOGGED-IN CUSTOMER PORTAL (My Lessons)
     3 separate Webflow HTML Embeds, stacked in order (1, 2, 3).
     Requires foxy-logic.js on the page (already on the portal).
     ===================================================================== -->


<!-- ############### PORTAL BLOCK 1 of 3 — HERO ############### -->
<div style="position:relative;width:100%;line-height:0">
  <img src="https://sundayschoolsimplified.netlify.app/assets/sss-portal-hero-v3.png"
       alt="Sunday School, Simplified — Your lessons are ready!"
       style="width:100%;display:block;border-radius:26px 26px 0 0">
</div>


<!-- ############### PORTAL BLOCK 2 of 3 — LET'S LEARN, [NAME] ############### -->
<!-- Font: uses a UNIQUE @font-face name ('SSSThierry') so it can't clash with any font
     already in Webflow. Falls back to 'Thierry Leonie' — so if your domain's CSP blocks the
     Netlify-hosted font, uploading thierry.woff2 to Webflow as "Thierry Leonie" makes it work
     same-origin. -->
<style>
  @font-face{font-family:'SSSThierry';
    src:url('https://sundayschoolsimplified.netlify.app/engine/assets/fonts/thierry.woff2') format('woff2');
    font-weight:400 800;font-display:swap;}
  .sss-ll{position:relative;width:100%;line-height:0}
  .sss-ll>img{width:100%;display:block}
  .sss-ll .ll-name{position:absolute;left:52%;right:14%;bottom:69%;
    white-space:nowrap;line-height:1;color:#1e2530;
    font-family:'SSSThierry','Thierry Leonie','Poppins',Arial,sans-serif;font-weight:800;letter-spacing:.005em}
  .sss-ll .ll-src{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .sss-ll a.hs{position:absolute;display:block}
</style>
<div class="sss-ll">
  <img src="https://sundayschoolsimplified.netlify.app/assets/sss-portal-letslearn-v2.png"
       alt="Let's learn — your lessons are below. Log in if you don't see them, or browse more lessons.">
  <span class="ll-src" foxy-logic-display="customer-first-name"></span>
  <span class="ll-name"><span class="t" id="llText">FRIEND</span></span>
  <a class="hs" href="/customer-portal/account"  style="left:52.5%;top:67%;width:6.5%;height:6%"  aria-label="Log in"></a>
  <a class="hs" href="/sunday-school-simplified" style="left:60%;top:76.5%;width:8%;height:6%" aria-label="Browse available lessons"></a>
</div>
<script>
  (function(){
    var MAXLEN=16, MIN_RATIO=0.62;
    function base(){ return document.querySelector('.sss-ll').clientWidth*0.0269; } // matches new compact heading cap-height
    function apply(raw){
      var box=document.querySelector('.sss-ll .ll-name'), t=document.getElementById('llText');
      var n=(raw||'').trim(), b=base();
      t.textContent=(!n||n.length>MAXLEN) ? 'FRIEND' : n.toUpperCase();
      t.style.fontSize=b+'px';
      var s=b, m=b*MIN_RATIO, g=0;                       // shrink-to-fit (applies to FRIEND too)
      while(box.scrollWidth>box.clientWidth && s>m && g<90){ s-=1; t.style.fontSize=s+'px'; g++; }
    }
    var src=document.querySelector('.sss-ll .ll-src');
    new MutationObserver(function(){apply(src.textContent)}).observe(src,{childList:true,characterData:true,subtree:true});
    addEventListener('resize',function(){apply(src.textContent)});
    addEventListener('load',function(){apply(src.textContent)});
    if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){apply(src.textContent)});} // re-fit once the font loads
    apply(src.textContent);
  })();
</script>


<!-- ############### PORTAL BLOCK 3 of 3 — YOUR PACKETS (gated per-packet) ############### -->
<!-- Tiles are now background-INDEPENDENT: cropped tight to Emily's card with transparent
     rounded corners (v3), so the section can use the landing page's lavender field.
     To go back to a plain white section, set --pk-bg:#fff below. Nothing else changes. -->
<style>
  .pk3{--pk-bg:#DFE6F4;            /* matches SSS landing "Choose your packet" */
       --pk-card:45.6%;            /* card width, landing proportion */
       --pk-gap:3.25%;
       background:var(--pk-bg);color:#24364b;padding:1.7% 2.6% 4.1%}
  .pk3 *{box-sizing:border-box}
  .pk3 .pk-head{display:block;width:38%;min-width:250px;max-width:700px;height:auto;margin:0 auto 4.2%}
  .pk3 .pk-grid{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;
       gap:var(--pk-gap);margin:0 auto}
  .pk3 .pk-cell{flex:0 1 var(--pk-card);max-width:1095px;min-width:0}
  .pk3.pk-one .pk-cell{flex-basis:62%}          /* a lone packet reads as a feature card */
  .pk3 .tile{position:relative;width:100%;line-height:0;
       filter:drop-shadow(0 12px 24px rgba(24,36,64,.20))}
  .pk3 .tile img{width:100%;display:block}
  .pk3 .tile a{position:absolute;display:block;border-radius:99px}
  .pk3 .tile a:focus-visible{outline:3px solid #0A274C;outline-offset:3px}
  @media (max-width:900px){
    .pk3{padding:4% 5% 7%}
    .pk3 .pk-head{width:66%;margin-bottom:6%}
    .pk3 .pk-cell,.pk3.pk-one .pk-cell{flex-basis:100%}
    .pk3 .pk-grid{gap:6%}
    .pk3 .tile a{top:78.3%!important;height:14%!important}   /* bigger tap targets */
  }
</style>
<div class="pk3" id="pk3">
  <img class="pk-head" src="https://sundayschoolsimplified.netlify.app/assets/sss-portal-header-v2.png"
       alt="Your Packets — each includes six lessons, online &amp; printable.">
  <div class="pk-grid">

    <div class="pk-cell" foxy-logic-transaction-includes="SSS-BEYONDBUMPER">
      <div class="tile">
        <img src="https://sundayschoolsimplified.netlify.app/assets/sss-portal-tile-bbs-v3.png"
             alt="Beyond Bumper Stickers — Volume 1, six lessons, online &amp; printable.">
        <a href="/sss/beyond-bumper-stickers"
           style="left:55.4%;top:80.5%;width:19.6%;height:9.5%" aria-label="Open the Beyond Bumper Stickers booklet"></a>
        <a href="#" onclick="return sssPDF('https://sundayschoolsimplified.netlify.app/packets/beyond-bumper-stickers/Beyond%20Bumper%20Stickers.pdf')"
           style="left:75.4%;top:80.5%;width:19.8%;height:9.5%" aria-label="Beyond Bumper Stickers printable PDF"></a>
      </div>
    </div>

    <div class="pk-cell" foxy-logic-transaction-includes="SSS-GOSPELWOMEN">
      <div class="tile">
        <img src="https://sundayschoolsimplified.netlify.app/assets/sss-portal-tile-women-v3.png"
             alt="The Gospel According to the Women — Volume 2, six lessons, online &amp; printable.">
        <a href="/sss/gospel-according-to-the-women"
           style="left:55.4%;top:80.5%;width:19.6%;height:9.5%" aria-label="Open The Gospel According to the Women booklet"></a>
        <a href="#" onclick="return sssPDF('https://sundayschoolsimplified.netlify.app/packets/gospel-according-to-the-women/The%20Gospel%20According%20to%20the%20Women.pdf')"
           style="left:75.4%;top:80.5%;width:19.8%;height:9.5%" aria-label="The Gospel According to the Women printable PDF"></a>
      </div>
    </div>

  </div>
</div>
<script>
  function sssPDF(url){ window.open(url,'sssPdf','width=980,height=1150,scrollbars=yes,resizable=yes'); return false; }
  (function(){
    function sync(){                         // foxy-logic reveals tiles asynchronously
      var secs=document.querySelectorAll('.pk3');
      for(var s=0;s<secs.length;s++){
        var cells=secs[s].querySelectorAll('.pk-cell'), shown=0;
        for(var i=0;i<cells.length;i++){ if(cells[i].offsetParent!==null) shown++; }
        secs[s].classList.toggle('pk-one', shown===1);
      }
    }
    new MutationObserver(sync).observe(document.body,{attributes:true,subtree:true,
      attributeFilter:['style','class','hidden']});
    addEventListener('resize',sync); addEventListener('load',sync);
    var n=0, t=setInterval(function(){ sync(); if(++n>20) clearInterval(t); },250);
    sync();
  })();
</script>
