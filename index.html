<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunday School Simplified — The Candler Foundry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--navy:#1E364C;--ink:#39434C;--muted:#6A7682;--cream:#E7E3DA;--line:#ECE6DA;--white:#fff;}
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--cream);font-family:"Hanken Grotesk",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1000px;margin:0 auto;padding:64px 28px 80px;}
  .series{display:flex;align-items:center;gap:14px;}
  .series span{width:38px;height:6px;border-radius:3px;background:#E0612F;}
  .series b{font-size:14px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--navy);}
  h1{font-family:"Newsreader",serif;font-weight:600;font-size:56px;line-height:1.02;color:var(--navy);margin:20px 0 0;letter-spacing:-.01em;}
  .lede{font-family:"Newsreader",serif;font-style:italic;font-size:21px;color:#5A6A78;margin-top:12px;max-width:640px;line-height:1.4;}
  .grid{margin-top:44px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;}
  .card{background:var(--white);border:1.5px solid var(--line);border-radius:20px;padding:26px;display:flex;flex-direction:column;transition:.15s;}
  .card:hover{border-color:var(--accent);transform:translateY(-3px);box-shadow:0 14px 34px rgba(17,42,65,.10);}
  .card .spine{width:44px;height:8px;border-radius:4px;background:var(--accent);margin-bottom:18px;}
  .card h2{font-family:"Newsreader",serif;font-weight:600;font-size:27px;line-height:1.08;color:var(--navy);margin:0;}
  .card .sub{font-family:"Newsreader",serif;font-style:italic;font-size:16px;color:var(--muted);margin-top:8px;flex:1;}
  .card .meta{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-top:16px;}
  .card .actions{display:flex;gap:10px;margin-top:18px;}
  .card a{font-size:13px;font-weight:700;text-decoration:none;border-radius:100px;padding:9px 16px;transition:.15s;}
  .card a.open{background:var(--accent);color:#fff;}
  .card a.open:hover{filter:brightness(.92);}
  .card a.pdf{background:transparent;color:var(--navy);border:1.5px solid var(--line);}
  .card a.pdf:hover{border-color:var(--accent);}
  .card.soon{opacity:.6;}
  .foot{margin-top:56px;border-top:1.5px solid var(--line);padding-top:20px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .foot a{color:var(--navy);font-weight:700;text-decoration:none;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="series"><span></span><b>The Candler Foundry</b></div>
    <h1>Sunday School Simplified</h1>
    <div class="lede">Short, scholarly-grounded lesson packets for teachers and small groups — each an online flipbook with a free downloadable PDF.</div>
    <div class="grid" id="grid"></div>
    <div class="foot"><div>Sunday School Simplified &middot; The Candler Foundry</div><div><a href="https://candlerfoundry.org">candlerfoundry.org</a></div></div>
  </div>
  <script>
    fetch('packets/index.json').then(function(r){return r.json();}).then(function(list){
      var grid=document.getElementById('grid');
      list.forEach(function(p){
        var live=p.status!=='soon';
        var a=document.createElement('div');
        a.className='card'+(live?'':' soon');
        a.style.setProperty('--accent',p.accent||'#E0612F');
        var actions=live
          ? '<div class="actions"><a class="open" href="packets/'+p.slug+'/">Open flipbook</a>'+
            (p.pdf?'<a class="pdf" href="packets/'+p.slug+'/'+encodeURIComponent(p.pdf)+'" download>PDF</a>':'')+'</div>'
          : '<div class="meta">Coming soon</div>';
        a.innerHTML='<div class="spine"></div><h2>'+p.title+'</h2>'+
          '<div class="sub">'+(p.subtitle||'')+'</div>'+
          '<div class="meta">'+(p.lessons?p.lessons+' Lessons':'')+'</div>'+actions;
        grid.appendChild(a);
      });
    }).catch(function(e){document.getElementById('grid').innerHTML='<p>Could not load packets.</p>';});
  </script>
</body>
</html>
