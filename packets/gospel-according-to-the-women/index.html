<style>
/* ===== The Gospel According to the Women — packet palette =====
   Navy binder (brand chrome, shared with the engine default) holding a warm
   yellow / brown interior. Scoped to this packet via CSS-variable overrides +
   a few warm-neutral tweaks; the shared engine is untouched. */
:root{
  --navy:#0A274C;   /* brand navy: chrome, headings, body text, numerals, buttons, active tab */
  --powder:#FFF59C; /* pale yellow: circles behind numerals + icons + question bubbles */
  --smoky:#6d4f26;  /* brown: secondary text (references, captions, labels) */
  --red:#6d4f26;    /* brown accent: rules, verse numbers, ribbon, rhythm circles, quotes */
  --page:#FFFEF7;   /* warm page */
  --card:#FBFAEA;   /* warm card */
  --cardbd:#E7E3C0;
  --dot:#D8D3A2;
  --stage:#EAE7CE;  /* warm cream behind the binder */
  --muted:#8f8757;
}
/* warm cream tabs (engine default is a cool blue) */
.tab{background:#FBFAEA;}
/* section icons: brown-recolored packet-local copies */
.ic-prayer::after{background-image:url('assets/icons/icon-prayer.svg');}
.ic-book::after{background-image:url('assets/icons/icon-book.svg');}
.ic-play::after{background-image:url('assets/icons/icon-play.svg');}
.ic-dialogue::after{background-image:url('assets/icons/icon-dialogue.svg');}
.ic-heart::after{background-image:url('assets/icons/icon-heart.svg');}
/* header sparks → brown (CSS stroke overrides the SVG presentation attribute) */
.hsparks g{stroke:#6d4f26;}
/* video card: warm yellow field with soft khaki "hills" (kept out of olive territory) */
.vcard{background:linear-gradient(180deg,#FCF8D2,#FFF59C);}
.vhills path:first-of-type{fill:#CDCB9E;}
.vhills path:last-of-type{fill:#B7B27E;}
/* footer hairline + page-edge stacks + gutter → warm neutrals to match the cream book */
.foot{border-top-color:#E7E3C0;}
.bookdeco .stack{background:repeating-linear-gradient(180deg,#FFFDF0 0 2px,#E7E1BE 2px 4px);}
.bookdeco .stack.left{background:linear-gradient(90deg,rgba(61,45,15,.14),rgba(61,45,15,0) 70%),repeating-linear-gradient(180deg,#FFFDF0 0 2px,#E7E1BE 2px 4px);}
.bookdeco .stack.right{background:linear-gradient(270deg,rgba(61,45,15,.14),rgba(61,45,15,0) 70%),repeating-linear-gradient(180deg,#FFFDF0 0 2px,#E7E1BE 2px 4px);}
.bookdeco .gutter{background:linear-gradient(90deg,rgba(10,39,76,0),rgba(10,39,76,.10) 46%,rgba(10,39,76,.16) 50%,rgba(10,39,76,.10) 54%,rgba(10,39,76,0));}
/* download ribbon → bright yellow to draw the eye (navy text/icon) */
.dlbtn{background:#FFD21E;color:#0A274C;box-shadow:-6px 6px 18px rgba(10,39,76,.30);}
.dlbtn i{color:#0A274C;}
/* fit longer question sets on page B without collision (verified via Playwright:
   Hannah's five long questions overflowed .qs by 45px at the old sizes) */
.qs .q{padding:8px 0;}
.qs .q p{font-size:16.5px;line-height:1.4;}
.card p{font-size:17px;}
</style>
</head>

      <div id="spine"></div>

    </div></div>
  </div>

  <script src="../../engine/render.js"></script>
</body>
</html>
